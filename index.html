<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartFix HMS - Hotel Management</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#060B14">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; background-color: #060B14; color: #E2E8F0; background-image: radial-gradient(circle at 50% 0%, #0d1b2a 0%, #060B14 70%); } .glass { background: rgba(16, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); } </style>
  <script> if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(console.error)); </script>
</head>
<body class="min-h-screen flex flex-col">
  <svg style="display: none;">
    <symbol id="logo" viewBox="0 0 460 110">
      <g transform="translate(10, 5)"><rect x="0" y="32" width="22" height="58" rx="2" stroke="#00B4D8" stroke-width="4" fill="#061224" /><rect x="68" y="32" width="22" height="58" rx="2" stroke="#00B4D8" stroke-width="4" fill="#061224" /><path d="M26 24 L45 8 L64 24 L64 90 L26 90 Z" stroke="#00E676" stroke-width="5" fill="#08182f" /><circle cx="45" cy="50" r="18" fill="#061426" stroke="#00E676" stroke-width="4" /><polyline points="37,50 43,56 55,42" fill="none" stroke="#00E676" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g>
      <text x="110" y="52" font-family="'Inter', sans-serif" font-weight="900" font-size="42" fill="#ffffff">Smart<tspan fill="#00B4D8">Fix</tspan></text><rect x="300" y="22" width="90" height="32" rx="16" fill="#00E676" /><text x="345" y="45" font-family="'Inter', sans-serif" font-weight="900" font-size="20" fill="#060B14" text-anchor="middle">HMS</text>
    </symbol>
  </svg>

  <header class="p-6 flex justify-between items-center max-w-7xl mx-auto w-full">
    <svg class="h-10 w-auto"><use href="#logo"></use></svg>
    <div class="space-x-4">
      <button onclick="openModal('login')" class="text-sm font-semibold text-slate-300 hover:text-white">Sign In</button>
      <button onclick="openModal('register')" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-[#00E676] to-[#00B4D8] text-[#060B14] font-bold text-sm">Get 30 Days Free</button>
    </div>
  </header>

  <main class="flex-1 flex flex-col items-center justify-center text-center px-4 mt-10">
    <h1 class="text-4xl md:text-6xl font-black text-white max-w-4xl leading-tight">Manage Rooms, POS & GST Billing. <br><span class="text-transparent bg-clip-text bg-gradient-to-r from-[#00E676] to-[#00B4D8]">All Inside One Fast PWA.</span></h1>
    <p class="mt-6 text-slate-400 max-w-2xl text-lg">Complete control over floors, room tariffs, per-head meal packages, restaurant KOT POS, and CA-ready tax reports.</p>
    <button onclick="openModal('register')" class="mt-10 px-8 py-4 rounded-xl bg-[#00E676] text-[#060B14] font-black text-lg shadow-lg shadow-[#00E676]/20 hover:scale-105 transition">Start Instant 30-Day Free Trial</button>
  </main>

  <!-- Auth Modal -->
  <div id="authModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="glass border border-slate-700 w-full max-w-md rounded-2xl p-6">
      <div class="flex justify-between items-center mb-6">
        <h3 id="modalTitle" class="text-xl font-bold text-white">Sign In</h3>
        <button onclick="document.getElementById('authModal').classList.add('hidden')" class="text-slate-400 text-2xl">&times;</button>
      </div>
      <form id="authForm" onsubmit="event.preventDefault(); handleAuth();" class="space-y-4">
        <div id="regFields" class="hidden space-y-3">
          <div><label class="block text-xs text-slate-400 mb-1">Hotel Name</label><input type="text" id="regHotelName" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white"></div>
          <div><label class="block text-xs text-slate-400 mb-1">GSTIN</label><input type="text" id="regGstin" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white font-mono"></div>
        </div>
        <div><label class="block text-xs text-slate-400 mb-1">Email</label><input type="email" id="authEmail" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white"></div>
        <div><label class="block text-xs text-slate-400 mb-1">Password</label><input type="password" id="authPassword" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white"></div>
        <div id="authAlert" class="hidden text-xs p-3 rounded-lg bg-rose-500/20 text-rose-400"></div>
        <button type="submit" id="authBtn" class="w-full py-3 bg-[#00E676] text-[#060B14] font-bold rounded-xl">Sign In</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { loginUser, registerNewHotel, monitorAuthState } from "./js/auth.js";
    let mode = 'login';

    monitorAuthState(state => {
      if (state?.profile) window.location.href = state.profile.role === 'superadmin' ? 'super-admin.html' : 'dashboard.html';
    });

    window.openModal = (m) => {
      mode = m;
      document.getElementById('authModal').classList.remove('hidden');
      document.getElementById('modalTitle').innerText = m === 'login' ? 'Sign In' : 'Register Hotel';
      document.getElementById('regFields').classList.toggle('hidden', m === 'login');
      document.getElementById('authBtn').innerText = m === 'login' ? 'Sign In' : 'Start Trial';
    };

    window.handleAuth = async () => {
      const email = document.getElementById('authEmail').value;
      const pass = document.getElementById('authPassword').value;
      const alert = document.getElementById('authAlert');
      alert.classList.add('hidden');
      try {
        if (mode === 'register') {
          const name = document.getElementById('regHotelName').value;
          const gstin = document.getElementById('regGstin').value;
          if (!name || !gstin) throw new Error("Name & GSTIN required");
          await registerNewHotel({ name, gstin }, email, pass);
          alert.className = "text-xs p-3 rounded-lg bg-[#00E676]/20 text-[#00E676] block";
          alert.innerText = "Registration successful! Please check your email to verify.";
        } else {
          const res = await loginUser(email, pass);
          if (!res.user.emailVerified && res.profile.role !== 'superadmin') {
            throw new Error("Please verify your email first. Check your inbox.");
          }
          window.location.href = res.profile.role === 'superadmin' ? 'super-admin.html' : 'dashboard.html';
        }
      } catch (e) { alert.className = "text-xs p-3 rounded-lg bg-rose-500/20 text-rose-400 block"; alert.innerText = e.message; }
    };
  </script>
</body>
</html>
