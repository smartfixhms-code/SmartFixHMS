<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Super Admin - SmartFix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { background: #060B14; color: #fff; font-family: sans-serif; }</style>
</head>
<body class="p-6">
  <div class="max-w-6xl mx-auto">
    <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
      <h1 class="text-2xl font-bold">Super Admin Console</h1>
      <button onclick="logoutUser()" class="bg-slate-800 px-4 py-2 rounded-lg text-sm">Logout</button>
    </header>
    <div class="bg-slate-900 rounded-xl p-4 mb-6">
      <h3 class="text-sm text-cyan-400 font-bold mb-2">Platform Pricing</h3>
      <div class="flex gap-4">
        <input type="number" id="p6" placeholder="6 Months Price" class="bg-slate-950 p-2 rounded border border-slate-700 text-sm">
        <input type="number" id="p1" placeholder="1 Year Price" class="bg-slate-950 p-2 rounded border border-slate-700 text-sm">
        <button onclick="savePricing()" class="bg-cyan-500 text-black px-4 py-2 font-bold rounded">Save</button>
      </div>
    </div>
    <table class="w-full text-left text-sm bg-slate-900 rounded-xl overflow-hidden">
      <thead class="bg-slate-950 text-slate-400"><tr><th class="p-4">Hotel</th><th class="p-4">GSTIN</th><th class="p-4">Status</th><th class="p-4">Expiry</th><th class="p-4 text-right">Actions</th></tr></thead>
      <tbody id="tenantBody"></tbody>
    </table>
  </div>
  <script type="module">
    import { db } from "./js/firebase-config.js";
    import { monitorAuthState, logoutUser } from "./js/auth.js";
    import { renewHotelLicense, listAllLicenseStatuses } from "./js/license.js";
    import { doc, setDoc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    monitorAuthState(state => {
      if(!state || state.profile?.role !== 'superadmin') return window.location.href = 'index.html';
      loadTenants(); loadPricing();
    });

    window.logoutUser = logoutUser;
    async function loadPricing() {
      const snap = await getDoc(doc(db, "system", "pricing"));
      if(snap.exists()) { document.getElementById("p6").value = snap.data().price6M || 4999; document.getElementById("p1").value = snap.data().price1Y || 8999; }
    }
    window.savePricing = async () => {
      await setDoc(doc(db, "system", "pricing"), { price6M: parseFloat(document.getElementById("p6").value), price1Y: parseFloat(document.getElementById("p1").value) });
      alert("Pricing updated!");
    }
    async function loadTenants() {
      const res = await listAllLicenseStatuses(); const tbody = document.getElementById("tenantBody");
      tbody.innerHTML = res.rows.map(t => `<tr class="border-b border-slate-800"><td class="p-4 font-bold">${t.hotelName}</td><td class="p-4 font-mono">${t.gstin||'-'}</td><td class="p-4 ${t.status==='expired'?'text-rose-400':'text-[#00E676]'}">${t.status}</td><td class="p-4">${new Date(t.planExpiresAt).toLocaleDateString()}</td><td class="p-4 text-right"><button onclick="renew('${t.id}', 6)" class="bg-slate-800 text-xs px-2 py-1 rounded">+6M</button><button onclick="renew('${t.id}', 12)" class="bg-slate-800 text-xs px-2 py-1 rounded">+1Y</button></td></tr>`).join('');
    }
    window.renew = async (id, m) => { await renewHotelLicense(id, m); loadTenants(); alert("Renewed!"); }
  </script>
</body>
</html>
